spring:
  application:
    name: leadfy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5544/leadfy}
    username: ${DB_USERNAME:leadfy}
    password: ${DB_PASSWORD:leadfy}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  # Render (and most PaaS providers) inject PORT at runtime; SERVER_PORT stays as the local/Docker override.
  port: ${PORT:${SERVER_PORT:8080}}

security:
  jwt:
    secret: ${JWT_SECRET:leadfy-development-secret-change-me}
    issuer: ${JWT_ISSUER:leadfy-api}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

leadfy:
  stale-lead:
    threshold-days: ${STALE_LEAD_THRESHOLD_DAYS:7}
    cron: ${STALE_LEAD_CRON:0 0 2 * * *}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:10}
