spring:
  application:
    name: leadfy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leadfy}
    username: ${DB_USERNAME:leadfy}
    password: ${DB_PASSWORD:leadfy}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:leadfy-development-secret-change-me}
    issuer: ${JWT_ISSUER:leadfy-api}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

leadfy:
  stale-lead:
    threshold-days: ${STALE_LEAD_THRESHOLD_DAYS:7}
    cron: ${STALE_LEAD_CRON:0 0 2 * * *}
