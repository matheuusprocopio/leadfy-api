services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadfy
      POSTGRES_USER: leadfy
      POSTGRES_PASSWORD: leadfy
    ports:
      - "5544:5432"
    volumes:
      - leadfy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadfy -d leadfy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/leadfy
      DB_USERNAME: leadfy
      DB_PASSWORD: leadfy
      JWT_SECRET: ${JWT_SECRET:-leadfy-development-secret-change-me}
    ports:
      - "8080:8080"

volumes:
  leadfy-db-data:
